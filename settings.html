<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f9dff0">
  <title>設定 | English Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/management.css">
</head>
<body>
  <main class="management-page">
    <nav class="page-nav">
      <a href="index.html">← ゲームへ戻る</a>
    </nav>

    <header class="management-header">
      <p>SETTINGS</p>
      <h1>設定</h1>
      <p>学習記録や問題データに関する操作を行います。</p>
    </header>

    <section class="setting-list">
      <a class="setting-card" href="question-manager.html">
        <span class="setting-icon">📝</span>
        <span>
          <strong>問題管理</strong>
          <small>カテゴリと問題の追加・編集・削除、JSONの出力</small>
        </span>
        <span aria-hidden="true">›</span>
      </a>

      <section class="setting-card setting-card-static">
        <span class="setting-icon">💾</span>
        <span>
          <strong>学習記録</strong>
          <small>クエストの挑戦記録、EXP、レベルを初期状態へ戻します。</small>
        </span>
        <button id="reset-progress-button" class="manager-button danger-button" type="button">記録をリセット</button>
      </section>
    </section>

    <!-- リセット後の完了メッセージを、画面読み上げでも通知する -->
    <p id="settings-status" class="manager-status" role="status" aria-live="polite"></p>
  </main>
  <script src="js/settings.js"></script>
</body>
</html>
