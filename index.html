<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f9dff0">
  <meta name="description" content="be動詞と一般動詞の使い分けを、クエスト感覚で楽しく学べる英語学習アプリです。">
  <title>English Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="sky-decor" aria-hidden="true">
    <span>✦</span><span>♡</span><span>✧</span><span>★</span>
  </div>

  <main class="app">
    <header class="app-header">
      <img src="data/assets/logo.png" alt="English Quest えいごマスターへの冒険！" class="brand-logo">
    </header>

    <section class="player-status" aria-label="プレイヤー情報">
      <div class="level-badge">
        <span>LEVEL</span>
        <strong id="player-level">1</strong>
      </div>
      <div class="exp-panel">
        <div class="status-row">
          <span>EXP</span>
          <strong id="exp-label">0 / 100</strong>
        </div>
        <div class="exp-track" role="progressbar" aria-label="次のレベルまでの経験値" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="exp-bar" class="exp-bar"></div>
        </div>
      </div>
      <div class="streak-badge" title="連続正解数">
        <span aria-hidden="true">🔥</span>
        <span><strong id="streak-count">0</strong> 連続</span>
      </div>
      <div class="correct-badge" title="このクエストの正解数">
        <img src="data/assets/icon-star.png" alt="">
        <span><strong id="correct-total">0</strong> 正解</span>
      </div>
    </section>

    <section id="category-screen" class="screen">
      <section class="adventure-hero" aria-label="English Questの冒険案内">
        <div class="hero-copy">
          <p>WELCOME, ENGLISH LEARNER!</p>
          <h2>えいごの世界を<br><span>冒険しよう！</span></h2>
          <p class="hero-message">クエストに挑戦して、ことばの力とEXPを集めよう。</p>
        </div>
        <img src="data/quest-heroes.png" alt="星の杖を持ったねこと、剣と盾を持ったうさぎ" class="hero-characters">
      </section>
      <div class="section-heading">
        <span class="heading-icon" aria-hidden="true">🗺️</span>
        <div>
          <p>QUEST BOARD</p>
          <h2>挑戦するクエストを選ぼう</h2>
        </div>
      </div>
      <div id="category-list" class="category-list"></div>

      <section class="progress-box">
        <div>
          <p class="box-kicker">🏆 ADVENTURE LOG</p>
          <h3>これまでの冒険記録</h3>
          <p id="total-progress">まだ記録はありません。</p>
        </div>
        <button id="reset-progress-button" class="button button-subtle" type="button">記録をリセット</button>
      </section>
    </section>

    <section id="quiz-screen" class="screen hidden">
      <div class="quiz-topbar">
        <button id="back-button" class="text-button" type="button">← クエスト選択</button>
        <span id="question-count" class="question-counter"></span>
      </div>

      <div class="quest-stage">
        <div class="stage-banner">
          <span aria-hidden="true">⚔️</span>
          <p id="category-name" class="category-label"></p>
          <span aria-hidden="true">✨</span>
        </div>
        <div class="quiz-card">
          <img src="data/quest-heroes.png" alt="" class="battle-characters" aria-hidden="true">
          <p class="mission-label">MISSION</p>
          <h2 id="question-text"></h2>
          <p id="question-hint" class="question-hint"></p>

          <div id="choices" class="choices"></div>

        </div>
      </div>

      <section id="explanation-box" class="feedback-overlay hidden" aria-live="polite" aria-modal="true" role="dialog">
        <div class="feedback-dialog">
          <div id="feedback-ribbon" class="feedback-ribbon">正解！</div>
          <div class="feedback-main">
            <img id="feedback-character" src="data/assets/feedback-correct.png" alt="喜んでいる案内役キャラクター">
            <div class="feedback-copy">
              <div class="feedback-heading">
                <p id="result-label" class="result-label"></p>
                <p id="exp-gain" class="exp-gain"></p>
              </div>
              <p id="answer-text" class="answer-text"></p>
              <p id="explanation-text"></p>
            </div>
          </div>
          <div class="point-box feedback-point">
            <img src="data/assets/icon-star.png" alt="">
            <div><strong>ポイント解説</strong><p id="point-text"></p></div>
          </div>
          <button id="next-button" class="button button-primary" type="button">つぎの問題へ ▶</button>
        </div>
      </section>
    </section>

    <section id="result-screen" class="screen hidden">
      <div class="result-card">
        <div class="result-crown" aria-hidden="true">👑</div>
        <p class="eyebrow">QUEST CLEAR!</p>
        <h2 id="result-title"></h2>
        <p id="result-score" class="result-score"></p>
        <p id="result-message"></p>

        <div class="result-actions">
          <button id="retry-button" class="button button-primary" type="button">もう一度チャレンジ</button>
          <button id="return-button" class="button button-secondary" type="button">クエスト選択へ</button>
        </div>
      </div>
    </section>
  </main>

  <div id="level-up" class="level-up hidden" role="status" aria-live="polite">
    <img src="data/assets/feedback-explain.png" alt="レベルアップを祝うキャラクター">
    <div><strong>レベルアップ！</strong><span id="level-up-values"></span></div>
  </div>

  <div id="loading-screen" class="loading-screen" role="status" aria-live="polite">
    <div class="loading-panel">
      <img src="data/assets/cat-sitting.png" alt="本を読みながら準備しているねこ">
      <strong>よみこみ中…</strong>
      <span><i></i><i></i><i></i><i></i><i></i></span>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
